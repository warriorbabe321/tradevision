<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatekeeper - TradeVision AI [VER: 8812b74]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-md w-full">
        <div class="text-center mb-12">
            <h1 class="text-3xl font-black text-indigo-500 italic tracking-tighter uppercase mb-2">TradeVision AI</h1>
            <p class="text-slate-400 font-bold uppercase tracking-widest text-xs">Institutional Research Node</p>
        </div>

        <div class="bg-slate-800 p-10 rounded-[40px] border border-slate-700 shadow-2xl">
            <h2 class="text-2xl font-black mb-6 text-center">Gatekeeper Access</h2>
            
            {% if error %}
            <div class="bg-rose-500/10 border border-rose-500 text-rose-500 p-4 rounded-2xl mb-6 text-sm font-bold text-center">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="post" class="space-y-6">
                <div>
                    <label for="access_key" class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Enter Access Key</label>
                    <input type="password" name="access_key" id="access_key" required autofocus
                        class="w-full bg-slate-900 border-2 border-slate-700 rounded-2xl py-4 px-6 focus:border-indigo-500 focus:outline-none transition-all font-medium text-lg placeholder-slate-600"
                        placeholder="••••••••••••">
                </div>
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-black text-lg transition-all active:scale-95 shadow-lg shadow-indigo-900/20">
                    Verify Identity
                </button>
            </form>
        </div>

        <p class="mt-12 text-center text-slate-500 text-[10px] font-black uppercase tracking-[0.2em]">
            Unauthorized access is strictly prohibited.
        </p>
    </div>
</body>
</html>
